services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DB_PATH: /data/mahjong.db
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: http://192.168.1.2:8080
        NEXT_PUBLIC_WS_URL: ws://192.168.1.2:8080/ws
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://192.168.1.2:8080
      NEXT_PUBLIC_WS_URL: ws://192.168.1.2:8080/ws
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
